  title: "Mathematics as an experimental science"
  abstract: "AI is transforming the field of mathematics. In this talk, I will present some on-going experiments that we are conducting with Large Language Models, proof assistants and an unusual large number of colleagues. These experiments would not have been possible a few months ago and could possibly be outdated on the day of the talk… I still hope to discuss relevant ways to enjoy and contribute to mathematics."
